<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Dimension Hub</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #0a0a0a;
            --card-bg: #121212;
            --portal-green: #1f5f14;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 25px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .nav-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--neon-green);
            color: var(--dark-bg);
            box-shadow: 0 0 25px var(--neon-green);
            text-shadow: none;
        }

        .content-section {
            display: none;
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--portal-green);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(31, 95, 20, 0.4);
        }

        .content-section.active-section {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .char-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .char-card:hover {
            transform: scale(1.05);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .char-avatar { font-size: 2.5rem; margin-bottom: 10px; }
        .char-name { font-weight: bold; color: #ccc; }
        .char-card:hover .char-name { color: var(--neon-green); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green);
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            color: #fff; font-size: 1.5rem; cursor: pointer;
        }
        .close-modal:hover { color: var(--neon-green); }
        .modal-title { color: var(--neon-green); margin-bottom: 15px; font-size: 1.8rem; }
        .modal-info { font-size: 1.1rem; line-height: 1.6; color: #ddd; }

        .phone-container { display: flex; justify-content: center; }
        .phone-wrapper {
            width: 320px;
            height: 550px;
            background: #000;
            border: 4px solid #333;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .phone-header {
            background: #111;
            padding: 10px;
            text-align: center;
            color: var(--neon-green);
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom: 1px solid #222;
        }

        .phone-chat-list {
            flex: 1; padding: 10px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .chat-contact {
            background: #1c1c1c; padding: 12px; border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: background 0.2s;
        }

        .chat-contact:hover { background: #252525; border-left: 3px solid var(--neon-green); }

        .phone-chat-screen {
            display: none; flex-direction: column; height: 100%;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0d0d; z-index: 10;
        }

        .chat-header {
            background: #1a1a1a; padding: 12px;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333;
        }

        .back-btn { background: none; border: none; color: var(--neon-green); cursor: pointer; font-size: 1.2rem; }
        .chat-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; }
        .msg.sent { background: var(--portal-green); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background: #262626; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }

        .chat-footer { padding: 10px; background: #111; display: flex; gap: 8px; }
        .chat-input { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 20px; outline: none; }
        .send-btn { background: var(--neon-green); border: none; color: #000; padding: 8px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .fact-box { text-align: center; padding: 20px 0; }
        .fact-text { font-size: 1.3rem; line-height: 1.6; margin-bottom: 25px; min-height: 80px; color: #e0e0e0; font-style: italic; }
        .fact-btn { background: var(--neon-green); color: #000; border: none; padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 0 15px var(--neon-green); transition: transform 0.2s; }
        .fact-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>🛸 Interdimensional Hub 🛸</h1>

    <div class="nav-container">
        <button class="nav-btn active" onclick="switchSection('characters')">👥 Character Wiki</button>
        <button class="nav-btn" onclick="switchSection('phone')">📱 Interdimensional Phone</button>
        <button class="nav-btn" onclick="switchSection('facts')">🧪 Random Facts</button>
    </div>

    <div id="characters" class="content-section active-section">
        <div class="character-grid" id="charGrid"></div>
    </div>

    <div id="phone" class="content-section">
        <div class="phone-container">
            <div class="phone-wrapper">
                <div class="phone-header">🌌 PortalOS v137.0</div>
                <div class="phone-chat-list" id="phoneContacts"></div>
                <div class="phone-chat-screen" id="chatScreen">
                    <div class="chat-header">
                        <button class="back-btn" onclick="closeChat()">⬅</button>
                        <span id="activeChatName" style="font-weight: bold; color: var(--neon-green);">Character</span>
                    </div>
                    <div class="chat-body" id="chatBody"></div>
                    <div class="chat-footer">
                        <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                        <button class="send-btn" onclick="sendPlayerMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="facts" class="content-section">
        <div class="fact-box">
            <div class="fact-text" id="factDisplay">Click the button below to retrieve random data from across the Central Finite Curve!</div>
            <button class="fact-btn" onclick="generateFact()">Get Schwifty Fact</button>
        </div>
    </div>

    <div class="modal" id="charModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="document.getElementById('charModal').style.display='none'">&times;</span>
            <div class="modal-title" id="modalTitle">Character Name</div>
            <div class="modal-info" id="modalInfo">Details go here...</div>
        </div>
    </div>

    <script>
        const characterData = [
            { name: "Rick Sanchez", emoji: "👴", description: "Genius scientist, cynical drunkard, and the co-architect of infinite chaos across dimensions. Originates from Dimension C-137.", textReplies: ["I'm busy making a universe battery, what do you want?", "Don't break your arms patting yourself on the back.", "Wubba Lubba Dub Dub! Just code it, bro."] },
            { name: "Morty Smith", emoji: "👦", description: "Rick's anxious, easily influenced 14-year-old grandson who spends half his life fearing for his mortal existence.", textReplies: ["Oh man, Rick... I don't think this texting thing is safe.", "Geez, can we just have a normal conversation for once?", "Ah text message? Aw man, okay."] },
            { name: "Summer Smith", emoji: "👱‍♀️", description: "Morty's teenage sister. Pragmatic, obsessed with status, and surprisingly capable in dangerous extraterrestrial missions.", textReplies: ["Ugh, literally dealing with a cosmic crisis right now.", "Whatever. Totally parsing your telemetry right now.", "Look, I'm with friends, stop texting."] },
            { name: "Mr. Poopybutthole", emoji: "🎩", description: "A long-time zany family friend of the Smiths known for his hyper-optimistic catchphrases and resilience.", textReplies: ["Oooo-wee! Glad to hear from you!", "How's it going out there in your dimension?!", "Ooo-wee, keep coding! You got this!"] },
            { name: "Birdperson", emoji: "🦅", description: "Rick's stoic alien best friend. Deeply philosophical and a freedom fighter against the Galactic Federation.", textReplies: ["It has been a challenging mating season for Birdperson.", "Your text signals a desire for interaction.", "I will respond once my cybernetic wings stabilize."] },
            { name: "Squanchy", emoji: "🐱", description: "A wild, cat-like creature who loves party environments and replacing verbs in sentences with the word 'squanch'.", textReplies: ["Hey! I'm totally squanching over here!", "You want to come squanch some code later?", "Squanch yeah! All night long!"] }
        ];

        const factsList = [
            "The show's theme song is an amalgamation/homage to both Doctor Who and Farscape.",
            "Rick's character was originally created as a parody of Doc Brown from Back to the Future.",
            "The green portal fluid formula is highly guarded, and unauthorized replication results in instant vaporization.",
            "Morty's constant stuttering and nervousness was inspired by the co-creator's improvisational voice acting sessions.",
            "Rick Sanchez's catchphrase 'Wubba Lubba Dub Dub' translates to 'I am in great pain, please help me' in Birdperson's native language.",
            "The Central Finite Curve is a walled-off partition of realities where Rick is always the smartest man alive.",
            "Pluto was momentarily reinstated as a planet by King Flippy Nips before being converted back into a corporate mining project."
        ];

        let activeChatIndex = 0;

        function switchSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active-section'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active-section');
            if(event) event.currentTarget.classList.add('active');
        }

        function initWiki() {
            const grid = document.getElementById('charGrid');
            characterData.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.onclick = () => showModal(index);
                card.innerHTML = `<div class="char-avatar">${char.emoji}</div><div class="char-name">${char.name}</div>`;
                grid.appendChild(card);
            });
        }

        function showModal(index) {
            const char = characterData[index];
            document.getElementById('modalTitle').innerText = char.name;
            document.getElementById('modalInfo').innerText = char.description;
            document.getElementById('charModal').style.display = 'flex';
        }

        function closeModal(e) { document.getElementById('charModal').style.display = 'none'; }

        function initMessenger() {
            const contactList = document.getElementById('phoneContacts');
            characterData.forEach((char, index) => {
                const contact = document.createElement('div');
                contact.className = 'chat-contact';
                contact.onclick = () => openChat(index);
                contact.innerHTML = `
                    <span style="font-size:1.5rem">${char.emoji}</span>
                    <div>
                        <div style="font-weight:bold">${char.name}</div>
                        <div style="font-size:0.75rem; color:#888;">Online</div>
                    </div>
                `;
                contactList.appendChild(contact);
            });
        }

        function openChat(index) {
            activeChatIndex = index;
            const char = characterData[index];
            document.getElementById('activeChatName').innerText = char.name;
            document.getElementById('chatBody').innerHTML = `<div class="msg received">Yo. This is ${char.name}. What dimension are you pinging from?</div>`;
            document.getElementById('chatScreen').style.display = 'flex';
        }

        function closeChat() { document.getElementById('chatScreen').style.display = 'none'; }

        function sendPlayerMessage() {
            const input = document.getElementById('chatInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            const chatBody = document.getElementById('chatBody');
            const userMsg = document.createElement('div');
            userMsg.className = 'msg sent';
            userMsg.innerText = messageText;
            chatBody.appendChild(userMsg);
            
            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            setTimeout(() => {
                const replies = characterData[activeChatIndex].textReplies;
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyMsg = document.createElement('div');
                replyMsg.className = 'msg received';
                replyMsg.innerText = randomReply;
                chatBody.appendChild(replyMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 1000);
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendPlayerMessage(); }

        function generateFact() {
            const display = document.getElementById('factDisplay');
            const randIndex = Math.floor(Math.random() * factsList.length);
            display.innerText = factsList[randIndex];
        }

        window.onload = () => { initWiki(); initMessenger(); };
    </script>
</body>
</html>
